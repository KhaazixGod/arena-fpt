# arena.toml — CL-0 configuration for the Isaac Sim arena (simulation only). Copy of ../cl0/cl0.toml (29/10/2026) with the differences listed below.
# cl0.toml of the real machine is NOT edited (arena/CLAUDE.md rule 3).  Every difference is annotated with "arena:" where it occurs.
# Differences:
#   calib_path, background_path          -> runs/calib/*  (generated from the scene by calib_from_scene.py, not by `cl0.calibrate`)
#   [camera] width/height/fourcc, latency_s -> 1280x720, no fourcc (no V4L2); latency_s 0.098 = value measured by calib_from_scene (fps 30 unchanged)
#   [belt] serial_port                   -> "" (virtual pulse counter in arena/platform.py)
#   [robot] home_q_deg                   -> pan +90, out of the belt window of the camera
#   [robot] gripper_open, grasp.gripper_w_mm -> 40 and 60 mm (E1 jaw geometry)
#   [robot] tcp_offset_mm                -> [-29, 0, 0]: grasp centre = middle of the open jaws (frame origin is on the fixed jaw), E2 finding
# Everything else (executor, track, perception, belt accel/delay/regex, tilt, margins ...) is the real machine's value: CL-0 is NOT tuned here (tuning only on DEV, rule 4).

calib_path = "runs/calib/calib.json"    # arena: written by arena/calib_from_scene.py (path relative to arena/)
background_path = "runs/calib/background.npz"    # arena: written by arena/calib_from_scene.py

[camera]
device = 0    # chỉ số /dev/videoN hoặc đường dẫn. D435i tạo ~6 nút /dev/video*; nút màu là nút có YUYV 1920x1080 (v4l2-ctl --list-formats-ext) [chưa kiểm: chưa cắm]
width = 1280    # arena: simulated camera 1280x720 (E1 default; the real D435i config is 1920x1080, E8 may switch)
height = 720    # arena: see width
fps = 30
fourcc = ""    # arena: no V4L2 in the simulator
latency_s = 0.098    # arena: MEASURED by calib_from_scene (runs/calib/calib_report.json: 98.2 ms median of 3 runs; true value 100 ms, the 2 ms gap is the 3 ms serial latency of the counter); real procedure: copy the result of `calibrate belt` here

[belt]
speed_mm_s = 50.0    # tốc độ chạy trong lượt thử (chọn theo L = v·tau/w, §3.1)
mm_per_step = 0.0    # điền sau khi hiệu chuẩn (cl0.calibrate belt)
textured = false
period_mm = 0.0    # chu vi băng, cần khi textured = true
accel_mm_s2 = 200.0    # dốc tăng/giảm tốc của băng (firmware); dùng cho mô hình s(t) khi không có bộ đếm
width_mm = 200.0    # bề rộng băng (cho cửa sổ nhìn / sinh sắp xếp); 27/10: người dùng đo 20 cm. Rộng 200 mm cần mặt băng thấp hơn đế ≳ 50 mm (xem SETUP_REPORT)
kind = "counter"    # 27/10: Arduino Uno/Nano báo số xung; người dùng chọn đi qua ROS 2 (phương án A, so101_env/src/so101_belt_bridge)
serial_port = ""    # arena: no serial port; arena/platform.py feeds cl0.hw.belt.Belt a virtual pulse counter (kind stays "counter")
serial_baud = 115200
serial_open_delay_s = 2.0    # chờ sau khi mở cổng: Arduino/ESP tự reset khi mở cổng serial (DTR) và bỏ qua lệnh trong lúc khởi động
cmd_speed = "V {steps_per_s:.2f}\n"    # dòng lệnh đặt tốc độ; trường: steps_per_s, v_mm_s
cmd_stop = "V 0\n"
line_regex = "^S[ ,:]+(-?\\d+)"    # nhóm 1 = số xung tích luỹ (kind = counter)
serial_latency_s = 0.003    # trễ từ lúc vi điều khiển đếm tới lúc PC nhận dòng
cmd_delay_s = 0.05    # trễ từ lúc PC gửi lệnh tới lúc băng bắt đầu đổi tốc độ (kind = model)

[robot]
port = "/dev/ttyACM0"
robot_id = "my_follower"
urdf = ""    # rỗng = dùng số liệu URDF chính thức nhúng sẵn
tcp_offset_mm = [-29.0, 0.0, 0.0]    # arena: gripper_frame_link sits ON the fixed jaw inner face; at gripper_open = 40 the gap spans x = -62..0 mm in that frame, its centre is x = -29..-31 mm (z 0..-10; runs/e2/tcp_offset.json, visual-mesh estimate). The real arm needs its own measured offset.
tilt_deg = 90.0    # góc chúc cố định của trục tiến vào (90 = thẳng xuống)
joint_margin_deg = 3.0
q_dot_max_deg_s = 150.0    # chặn tốc độ khớp ở lệnh gửi đi (an toàn)
home_q_deg = [90.0, -49.0, 48.0, 91.0, 0.0]    # arena: pan +90 puts the folded arm beside the base, OUT of the camera belt window (runs/e2/home_probe); default pan 0 sits on the belt and would be baked into the background
hold_q_deg = [0.0, -37.0, 41.0, 86.0, 0.0]    # tư thế giữ vật 2 s sau khi nhấc (cố định trong W)
gripper_open = 40.0    # arena: E1 jaw-gap estimate 59-62 mm at pos 40 (runs/e1/e1_gripper_gap.json); CL-0 default 60 gives > 90 mm
gripper_closed = 0.0
gripper_held_margin = 6.0    # kẹp dừng cao hơn closed + margin => có vật
max_relative_target = 0.0    # 0 = không dùng của LeRobot (bộ thực thi tự chặn tốc độ)

[executor]
control_hz = 50.0
z_grasp_above_belt_mm = 10.0    # độ cao TCP khi kẹp so với mặt băng (cố định, CL-0 không biết chiều cao vật)
pre_height_mm = 40.0
lift_height_mm = 60.0
min_z_above_belt_mm = 3.0    # chặn cứng: không bao giờ ra lệnh thấp hơn
omega_xy = 7.0    # rad/s, bộ lọc tới hạn trong hệ băng
vmax_xy = 300.0    # mm/s trong hệ băng
omega_z = 9.0
vmax_z = 150.0
omega_yaw = 9.0
vmax_yaw = 360.0    # độ/s
tol_xy_mm = 4.0
tol_meas_xy_mm = 6.0    # sai lệch đo được (FK của khớp đọc về) cho phép trước khi hạ
tol_z_mm = 2.5
tol_yaw_deg = 6.0
settle_s = 0.2
lead_s = 0.0    # dẫn trước bù độ trễ cánh tay: dùng s(t + lead)  [đo bằng cl0.calibrate lag]
lag_ki = 2.5    # 1/s; tích phân bù (lệnh gốc − đo được) cho trễ servo / võng trọng lực; 0 = tắt
lag_int_max_mm = 25.0
lag_int_window_mm = 30.0    # chỉ tích phân khi sai lệch nhỏ hơn mức này
lag_int_vmax_mm_s = 40.0    # và khi bộ lọc gần tĩnh (tốc độ hệ băng nhỏ hơn mức này)
freeze_radius_mm = 45.0    # ngừng cập nhật mục tiêu khi TCP vào gần (đầu kẹp che vật)
arm_exclusion_mm = 55.0    # bỏ phát hiện có tâm trong bán kính này quanh TCP
close_wait_s = 0.7
lift_wait_s = 0.6
hold_s = 2.0
move_hold_s = 1.0
trial_timeout_s = 20.0
t_to_grasp_s = 1.8    # ước lượng thời gian từ lúc chọn tới lúc kẹp; vật phải nằm trong vùng với tới ngay lúc chọn, giữa chừng, lúc kẹp và lúc nhấc
follow_margin_s = 1.0    # vật còn phải ở trong vùng với tới thêm chừng này sau khi kẹp (tới hết lúc nhấc)
ik_fail_abort_s = 0.6
t_after_settle_s = 2.1    # từ lúc ổn định ở độ cao chờ tới lúc nhấc xong (hạ + khép + nhấc); dùng kiểm khả thi trước khi hạ
lift_timeout_s = 2.0    # quá hạn (hoặc IK hỏng khi nhấc) thì vẫn chuyển sang tư thế giữ
hard_timeout_s = 45.0    # chốt cứng cho cả lượt: sau mức này mở kẹp và về nhà
move_peak_deg_s = 150.0    # đỉnh tốc độ khớp khi di chuyển trong không gian khớp (kéo dài thời gian nếu cần)
a_pick_min = -1e+09    # cửa sổ nhặt bổ sung theo a (W-căn-theo-băng); mặc định không giới hạn
a_pick_max = 1e+09

[track]
gate_mm = 12.0
n_confirm = 3
window = 6
max_std_mm = 5.0    # độ lệch chuẩn lớn hơn => chưa ổn định (vật đang trượt / mặt nạ nhảy)
lost_s = 1.5

[perception]
res_mm = 0.5
k_sigma = 4.0    # ngưỡng = max(k_sigma * sigma_nền, t_min)
t_min = 18.0    # mức xám tối thiểu (tối đa trên 3 kênh)
sigma_floor = 3.0
photometric_comp = true    # trừ độ lệch trung vị toàn ảnh (bù đổi sáng/phơi sáng)
open_mm = 1.5
close_mm = 3.0
min_area_mm2 = 150.0
max_area_mm2 = 12000.0    # lớn hơn: coi là cánh tay/bàn tay, bỏ
edge_margin_px = 3
split = "none"    # "none" (CL-0 gốc) | "watershed" (nút tinh chỉnh)
shift_search_mm = 0.0

[perception.grasp]
dt_plateau_frac = 0.95    # vùng "cao nguyên" DT: DT >= frac * DT_max; điểm kẹp = điểm cao nguyên gần tâm cao nguyên nhất
isotropic_ratio = 1.15    # tỉ lệ trục (căn bậc hai tỉ số trị riêng) dưới ngưỡng này => coi là đẳng hướng
isotropic_theta_deg = 90.0    # góc trục khép (hệ băng) dùng cho vật đẳng hướng; 90 = khép ngang băng
yaw_mode = "local"    # E10: nút không thuộc CL-0 gốc, chỉ thử trong sim, người dùng đồng ý 2/11
local_radius_mm = 25.0
gripper_w_mm = 60.0    # arena: matches gripper_open = 40 [geometric estimate, E4 ORACLE checks]
width_margin_mm = 4.0    # bỏ vật nếu bề ngang tại điểm kẹp > w - margin
min_dt_mm = 1.5    # bán kính nội tiếp tối thiểu: mỏng hơn thì không kẹp được
